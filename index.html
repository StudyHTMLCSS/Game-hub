<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<style>
  html,body{
    margin:0; padding:0; min-height:100%;
    background:#150a30;
    display:flex; align-items:center; justify-content:center;
  }
  .hub{ position:relative; width:100%; max-width:1400px; }
  .hub > img{ width:100%; display:block; }

  .slot{
    position:absolute; display:block; border-radius:28px;
    transition:box-shadow .2s, background .2s, transform .2s;
  }
  .slot:hover, .slot:focus{
    background:rgba(255,255,255,.08);
    box-shadow:0 0 0 4px rgba(120,220,255,.8), 0 0 35px rgba(120,220,255,.6);
    transform:scale(1.02);
  }

  .slot-1{ left:8.4%;  top:27.4%; width:25.6%; height:39%; } /* Snake   -> game1 */
  .slot-2{ left:36.7%; top:27.4%; width:25.6%; height:39%; } /* Zombie  -> game2 */
  .slot-3{ left:65.6%; top:27.4%; width:25.6%; height:39%; } /* Bubbles -> game3 */
</style>
</head>
<body>
  <div class="hub">
    <img src="bg.png" alt="Game Hub — выбери игру">

    <a class="slot slot-1" href="game1.html" title="Snake · Present Simple (-S)"></a>
    <a class="slot slot-2" href="game2.html" title="Zombie · Phrasal Verbs"></a>
    <a class="slot slot-3" href="game3.html" title="Grammar Bubbles · There was / There were"></a>
  </div>
</body>
