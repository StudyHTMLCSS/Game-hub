<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<style>
  html,body{
    margin:0; height:100%; overflow:hidden;      /* без прокрутки */
    background:#150a30;
    display:flex; align-items:center; justify-content:center;
  }

  /* 1.75 = ширина bg.png / высота bg.png. У другого фона — пересчитай */
  .hub{ position:relative; width:min(100%, 1400px, calc(100vh * 1.75)); }
  .hub > img{ width:100%; display:block; }

  /* зона клика = вся карточка */
  .slot{ position:absolute; display:block; }

  /* светящаяся рамка ВОКРУГ КНОПКИ PLAY, появляется при наведении */
  .slot::after{
    content:""; position:absolute; opacity:0; transition:opacity .15s;
    left:23%; right:23%; bottom:5%; height:15%;   /* положение рамки */
    border-radius:999px;
    box-shadow:0 0 0 4px rgba(90,220,255,.95), 0 0 30px rgba(90,220,255,.7);
  }
  .slot:hover::after, .slot:focus::after{ opacity:1; }

  .slot-1{ left:8%;    top:26%; width:26.5%; height:44%; } /* Snake   */
  .slot-2{ left:36.3%; top:26%; width:26.5%; height:44%; } /* Zombie  */
  .slot-3{ left:65.2%; top:26%; width:26.5%; height:44%; } /* Bubbles */
</style>
</head>
<body>
  <div class="hub">
    <img src="bg.png" alt="Game Hub — выбери игру">
    <a class="slot slot-1" href="game1.html" title="Snake · Present Simple (-S)"></a>
    <a class="slot slot-2" href="game2.html" title="Zombie · Phrasal Verbs"></a>
    <a class="slot slot-3" href="game3.html" title="Grammar Bubbles · There was / There were"></a>
  </div>
</body>
</html>
