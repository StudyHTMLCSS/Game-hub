<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<style>
  /* ================= СТРАНИЦА НА ВЕСЬ ЭКРАН ================= */
  html,body{
    margin:0; height:100%; overflow:hidden;      /* без прокрутки */
    background:#150a30;
    display:flex; align-items:center; justify-content:center;
  }

  /* Размытый фон НА ВЕСЬ ЭКРАН — убирает тёмные полосы по бокам.
     Картинка в центре целая, а края экрана заполнены «космосом». */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background:url("bg.png") center/cover no-repeat;
    filter:blur(40px) brightness(.5);
    transform:scale(1.15);   /* прячет размытые края */
  }

  /* Хаб: картинка целиком влезает по высоте.
     1.75 = ширина bg.png ÷ высота bg.png.
     Если по бокам останутся узкие полосы — поставь 1.8 или 1.82 */
  .hub{ position:relative; width:min(100vw, calc(100vh * 1.75)); }
  .hub > img{ width:100%; display:block; }

  /* ХОЧЕШЬ КАРТИНКУ ВПЛОТНУЮ ПО КРАЯМ (обрезается сверху/снизу)?
     Замени две строки .hub и .hub>img на эти:
     .hub{ position:relative; width:100vw; height:100vh; }
     .hub > img{ width:100%; height:100%; object-fit:cover; }
     и тогда подправь top/height зон через красную подсказку ниже. */

  /* ================= КЛИКАБЕЛЬНЫЕ ЗОНЫ ================= */
  /* Прозрачные ссылки поверх карточек; в покое невидимы */
  .slot{
    position:absolute; display:block; border-radius:28px;
    transition:box-shadow .2s, background .2s, transform .2s;
    /* здесь НЕ должно быть box-shadow и background */
  }
  /* Подсветка только при наведении */
  .slot:hover, .slot:focus{
    background:rgba(255,255,255,.08);
    box-shadow:0 0 0 4px rgba(120,220,255,.8), 0 0 35px rgba(120,220,255,.6);
    transform:scale(1.02);
  }

  /* ============ КООРДИНАТЫ ЗОН (в % от картинки) ============
     Зона теперь идёт ОТ ВЕРХА КАРТОЧКИ ДО НИЗА КНОПКИ PLAY.
     left — отступ слева, top — сверху, width/height — размер.
     Вниз = увеличить top; растянуть вниз = увеличить height.
     ДЛЯ НАСТРОЙКИ: временно добавь в .slot{ } строку
     background:rgba(255,0,0,.25); — увидишь зоны красным. Настроила — удали. */
  .slot-1{ left:5.2%;  top:33.5%; width:27.8%; height:55%; } /* Snake   -> game1 */
  .slot-2{ left:36%;   top:33.5%; width:27.8%; height:55%; } /* Zombie  -> game2 */
  .slot-3{ left:66.7%; top:33.5%; width:27.8%; height:55%; } /* Bubbles -> game3 */
</style>
</head>
<body>
  <!-- Хаб: картинка + 3 прозрачные ссылки поверх карточек -->
  <div class="hub">
    <img src="bg.png" alt="Game Hub — выбери игру">

    <a class="slot slot-1" href="game1.html" title="Snake · Present Simple (-S)"></a>
    <a class="slot slot-2" href="game2.html" title="Zombie · Phrasal Verbs"></a>
    <a class="slot slot-3" href="game3.html" title="Grammar Bubbles · There was / There were"></a>
  </div>
</body>
</html>
